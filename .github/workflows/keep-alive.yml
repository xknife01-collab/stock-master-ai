name: Keep-Alive & Auto-Pulse

on:
  schedule:
    # KST 09:00 ~ 15:45 (UTC 00:00 ~ 06:45) 매 15분마다 월~금 실행
    - cron: '*/15 0-6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Health
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://stock-master-ai.onrender.com/health
          echo "Health check ping complete."

      - name: Trigger AI Pulse
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://stock-master-ai.onrender.com/api/ai/pulse
          echo "AI Pulse trigger complete."
